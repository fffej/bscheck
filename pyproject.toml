[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bscheck"
version = "0.1.0"
description = "A bullshit type checker for Markdown, powered by Jev."
requires-python = ">=3.11"
dependencies = ["typesafe-sdk>=0.5.7,<1", "python-dotenv>=1,<2", "markdown-it-py>=3,<5"]

[project.scripts]
bscheck = "bscheck.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12"]
